<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poole. | 大阪・天王寺 カフェ&ジンバー</title>
<meta name="description" content="大阪市天王寺区、大道の路地裏にある隠れ家カフェ&バー「poole.」公式サイト。昼はカフェ、夜はクラフトジンバーへ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f2ead9;
    --cream-dim:#cfc6b4;
    --ink:#18130f;
    --ink-soft:#2a231c;
    --rug:#a4402a;
    --rug-soft:#c1613f;
    --amber:#e2a544;
    --amber-dim:#b9843a;
    --line: rgba(242,234,217,0.18);
    --bg: var(--day-bg);
    --fg: var(--ink);
    --accent: var(--rug);
    --accent-soft: var(--rug-soft);
    --panel: #ffffff;
    --panel-ink: var(--ink);
    --sub: #5c5347;
    --radius: 2px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    background: #ece4d4;
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition: background .8s var(--ease), color .8s var(--ease);
  }
  body.night{ background:#100d0b; color:var(--cream); }

  a{color:inherit;}
  img{display:block; max-width:100%;}
  .serif{ font-family:'Shippori Mincho', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; letter-spacing:.02em; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }

  /* ---------- HEADER ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 32px;
    mix-blend-mode: normal;
    color: var(--cream);
    transition: padding .4s var(--ease), background .4s var(--ease);
  }
  header.scrolled{
    background: rgba(16,13,11,0.72);
    backdrop-filter: blur(8px);
    padding: 14px 32px;
    border-bottom:1px solid var(--line);
  }
  .logo{
    font-family:'Shippori Mincho', serif;
    font-size: 24px;
    font-weight:800;
    letter-spacing:.04em;
  }
  .logo span{ color: var(--amber); }

  nav.primary{ display:flex; align-items:center; gap: 34px; }
  nav.primary a{
    font-size: 13px;
    letter-spacing:.14em;
    text-decoration:none;
    text-transform:uppercase;
    opacity:.86;
    position:relative;
    padding-bottom:4px;
  }
  nav.primary a::after{
    content:''; position:absolute; left:0; bottom:0; height:1px; width:0%;
    background: var(--amber); transition: width .35s var(--ease);
  }
  nav.primary a:hover::after{ width:100%; }
  nav.primary a:hover{ opacity:1; }

  .nav-links{ display:flex; gap:34px; }

  /* toggle switch — pull-cord bulb style */
  .mode-toggle{
    display:flex; align-items:center; gap:10px;
    cursor:pointer; user-select:none;
    padding: 6px 12px 6px 6px;
    border:1px solid var(--line);
    border-radius: 999px;
  }
  .bulb{
    width: 20px; height:20px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff7dd, var(--amber) 55%, #8a6420 100%);
    box-shadow: 0 0 10px 2px rgba(226,165,68,.55);
    transition: box-shadow .4s var(--ease), background .4s var(--ease);
    flex-shrink:0;
  }
  body:not(.night) .bulb{
    background: radial-gradient(circle at 35% 30%, #fff, #d9d0bd 60%, #a89f8c 100%);
    box-shadow:none;
  }
  .mode-label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
  .mode-label .a{ opacity:1; }
  .mode-label .b{ opacity:.4; }
  body.night .mode-label .a{ opacity:.4; }
  body.night .mode-label .b{ opacity:1; }

  .burger{ display:none; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    height: 100svh;
    min-height: 560px;
    width:100%;
    overflow:hidden;
    color: var(--cream);
  }
  .hero-media{
    position:absolute; inset:0;
  }
  .hero-media img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition: opacity 1.1s var(--ease);
  }
  .hero-media img.active{ opacity:1; }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(16,13,11,.15) 0%, rgba(16,13,11,.35) 55%, rgba(16,13,11,.92) 100%);
    z-index:1;
  }
  .hero-content{
    position:relative; z-index:2;
    height:100%;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding: 0 32px 64px;
    max-width: 1180px; margin:0 auto;
  }
  .eyebrow-row{
    display:flex; align-items:center; gap:14px; margin-bottom:22px;
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%; background: var(--amber);
    box-shadow:0 0 8px 2px rgba(226,165,68,.7);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase; opacity:.9;
  }
  .hero h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size: clamp(34px, 6.4vw, 78px);
    line-height:1.28;
    letter-spacing:.02em;
    max-width: 14ch;
    transition: opacity .5s var(--ease);
  }
  .hero p.sub{
    margin-top:22px;
    font-size: clamp(14px,1.6vw,17px);
    max-width: 46ch;
    line-height:1.9;
    color: var(--cream-dim);
  }
  .hero-meta{
    margin-top:38px;
    display:flex; gap: 34px; flex-wrap:wrap;
    border-top:1px solid var(--line);
    padding-top:22px;
  }
  .hero-meta .item .k{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color: var(--amber); display:block; margin-bottom:6px; }
  .hero-meta .item .v{ font-size:14px; letter-spacing:.02em; }

  .scroll-cue{
    position:absolute; right:32px; bottom:28px; z-index:2;
    writing-mode: vertical-rl;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.2em; color: var(--cream-dim);
    display:flex; align-items:center; gap:10px;
  }
  .scroll-cue::after{
    content:''; width:1px; height:46px; background: var(--cream-dim);
    animation: drop 2.2s infinite var(--ease);
  }
  @keyframes drop{ 0%{transform:scaleY(0); transform-origin:top;} 50%{transform:scaleY(1); transform-origin:top;} 51%{transform-origin:bottom;} 100%{transform:scaleY(0); transform-origin:bottom;} }

  /* ---------- SECTION GENERIC ---------- */
  section{ position:relative; padding: 120px 0; }
  .section-head{ margin-bottom: 56px; }
  .section-head .tag{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    color: var(--accent);
    display:block; margin-bottom:16px;
  }
  .section-head h2{
    font-family:'Shippori Mincho', serif; font-weight:700;
    font-size: clamp(26px, 3.6vw, 42px);
    line-height:1.5;
  }

  /* ---------- ABOUT ---------- */
  .about{ background: var(--panel); color: var(--panel-ink); }
  body.night .about{ background:#171310; color:var(--cream); }
  .about-grid{
    display:grid; grid-template-columns: 1.1fr .9fr; gap: 70px; align-items:center;
  }
  .about-copy p{
    font-size:15.5px; line-height:2.05; color: var(--sub); margin-bottom:20px;
    max-width:52ch;
  }
  body.night .about-copy p{ color: var(--cream-dim); }
  .about-copy p:last-of-type{ margin-bottom:0; }
  .about-figure{ position:relative; }
  .about-figure img{ width:100%; aspect-ratio: 4/5; object-fit:cover; }
  .about-figure .frame-tag{
    position:absolute; left:-1px; bottom:-1px;
    background: var(--accent); color:#fff;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em;
    padding: 8px 14px;
  }

  .divider-strip{
    display:flex; align-items:center; gap:18px; margin: 60px 0 0;
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.14em; color:var(--sub); text-transform:uppercase;
  }
  .divider-strip::before, .divider-strip::after{ content:''; height:1px; flex:1; background: var(--line); }
  body:not(.night) .divider-strip{ color:#8a8071; }
  body:not(.night) .divider-strip::before, body:not(.night) .divider-strip::after{ background:#ded4c1; }

  /* ---------- MENU ---------- */
  .menu{ background:#ece4d4; }
  body.night .menu{ background:#100d0b; }
  .menu-top{
    display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:20px;
  }
  .menu-window{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:.06em;
    padding: 10px 16px; border:1px solid var(--line); border-radius:999px;
  }
  body:not(.night) .menu-window{ border-color:#ded4c1; }

  .menu-grid{
    margin-top: 50px;
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    background: var(--line);
    border:1px solid var(--line);
  }
  body:not(.night) .menu-grid{ background:#ded4c1; border-color:#ded4c1; }

  .menu-card{
    background: #171310; position:relative; overflow:hidden;
    min-height: 380px;
    display:flex; flex-direction:column; justify-content:flex-end;
    transition: background .6s var(--ease);
  }
  body:not(.night) .menu-card{ background:#fff; }
  .menu-card .mc-img{ position:absolute; inset:0; }
  .menu-card .mc-img img{ width:100%; height:100%; object-fit:cover; opacity:.55; transition: opacity .5s var(--ease), transform .7s var(--ease); }
  .menu-card:hover .mc-img img{ opacity:.8; transform: scale(1.04); }
  body:not(.night) .menu-card .mc-img img{ opacity:.92; }
  body:not(.night) .menu-card:hover .mc-img img{ opacity:1; }
  .menu-card::before{
    content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 30%, rgba(16,13,11,.92) 100%);
    z-index:1;
  }
  body:not(.night) .menu-card::before{
    background: linear-gradient(180deg, transparent 20%, rgba(255,255,255,.97) 88%);
  }
  .mc-body{ position:relative; z-index:2; padding: 26px 24px;
